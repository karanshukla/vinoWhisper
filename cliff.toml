# git-cliff configuration — generates CHANGELOG.md from conventional commits.
# Docs: https://git-cliff.org/docs/configuration
#
# Usage:
#   git cliff -c cliff.toml -o CHANGELOG.md          # regenerate everything
#   git cliff -c cliff.toml --tag v0.3.0 -o CHANGELOG.md  # file pending commits under v0.3.0
#   git cliff --unreleased                           # preview, to stdout

[changelog]
header = """
# Changelog

All notable changes to vinoWhisper are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

Generated by [git-cliff](https://git-cliff.org) from conventional commits, then
hand-refined — the release workflow reads its notes from here, so edits stick.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
  { pattern = ' +\n', replace = "\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false

# A tag is a release boundary if it starts with "v" + a digit.
tag_pattern = "v[0-9].*"
sort_commits = "newest"
filter_commits = true

# Parser rules are evaluated top-to-bottom and a commit takes the FIRST match,
# so the skips have to come before the group assignments.
commit_parsers = [
  { message = "^Merge (pull request|branch|remote-tracking branch)", skip = true },
  { message = "^Bump version:", skip = true },
  # The commit that cuts a release is bookkeeping about the changelog itself —
  # it would otherwise appear as a Documentation entry in the section it cut.
  { message = "^docs\\(changelog\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^[Uu]pdate (dependency|actions?|.*digest)", skip = true },
  { message = "^feat", group = "<!-- 01 -->🚀 Features" },
  { message = "^fix", group = "<!-- 02 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 03 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 04 -->♻️ Refactor" },
  { message = "^revert", group = "<!-- 05 -->⏪ Reverted" },
  { message = "^docs", group = "<!-- 06 -->📚 Documentation" },
  { message = "^test", group = "<!-- 07 -->🧪 Tests" },
  { message = "^style", group = "<!-- 08 -->🎨 Styling" },
  { message = "^ci", group = "<!-- 09 -->👷 CI/CD" },
  { message = "^build", group = "<!-- 10 -->📦 Build" },
  { message = "^chore", group = "<!-- 11 -->🔧 Miscellaneous" },
]

[remote.github]
owner = "karanshukla"
repo = "vinoWhisper"
