name: Release

# Tag-driven: `uv run bump-my-version bump minor` writes the version, commits
# and tags v0.3.0; pushing that tag cuts the release.
#
# Three jobs rather than one, and the split is about permissions rather than
# tidiness. Building needs nothing, the GitHub Release needs `contents: write`,
# and PyPI needs `id-token: write` for Trusted Publishing. Keeping them apart
# means the upload step never holds a token that can write to the repo, and the
# build step holds neither. `build` publishes the artifacts both consumers
# download, so the bytes that reach PyPI are the same bytes attached to the
# GitHub Release, not a second build of the same tag.
#
# PyPI publishing uses **Trusted Publishing**: no API token exists anywhere, in
# the repo or on a laptop. GitHub mints a short-lived OIDC token that PyPI
# trusts because the project's publisher config names this exact repo, workflow
# file and environment. Changing the workflow filename or the environment name
# breaks the upload by design, so change the publisher config on PyPI first.
#
# This project deliberately did not ship to PyPI until 2026-08-31, because
# `pip install vinowhisper` would have resolved openvino from PyPI, where the
# builds that can construct the NPU static Whisper pipeline did not exist.
# Stable 2026.3.1 fixed that (see docs/install.md), so the whole dependency set
# now resolves from PyPI and a plain pip install genuinely works.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag v${VERSION} does not match pyproject.toml version ${declared}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata renders on PyPI
        # A README that renders on GitHub can still be rejected by PyPI, and a
        # rejected upload cannot be retried under the same version. Catch it
        # here, before anything is uploaded anywhere.
        run: uvx twine check --strict dist/*

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG.md is the single source of release prose: git-cliff
          # generates it from conventional commits but it is hand-refined
          # before a release, and re-deriving notes from commits here would
          # silently discard those edits.
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1              { found = 1; next }
            found && index($0, "## [") == 1  { exit }
            found                            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```'
            echo "pip install vinowhisper==${VERSION}"
            echo '```'
            echo
            echo 'Or the guided install, which also handles the NPU driver, the'
            echo 'model export and the systemd units:'
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/scripts/install.sh | bash"
            echo '```'
          } >> RELEASE_NOTES.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/
            RELEASE_NOTES.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Named on PyPI's publisher config, so it is load-bearing rather than
    # decorative. It is also where a required reviewer would go if this ever
    # wants a human in the loop before an upload.
    environment:
      name: pypi
      url: https://pypi.org/p/vinowhisper
    permissions:
      id-token: write # OIDC for Trusted Publishing. No API token anywhere.
    steps:
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist

      # Before the GitHub Release, deliberately. A PyPI version can never be
      # re-uploaded, so if this fails the tag can be deleted and re-cut; if the
      # release existed first, that would leave a published release pointing at
      # a version PyPI does not have.
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout, so `gh` cannot infer the repo from a git
          # remote and exits with "fatal: not a git repository". GH_REPO is the
          # supported way to tell it, and is cheaper than checking out the tree
          # only to throw it away. Caught the hard way cutting v0.3.0: the PyPI
          # upload had already succeeded, so the release had to be created by
          # hand from the artifacts this job downloads.
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag=false
