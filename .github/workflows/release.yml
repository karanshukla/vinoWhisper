name: Release

# Runs on the tag bump-my-version creates. Why the jobs are split: docs/development.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  gui:
    # musl, so one static binary runs on any distro. Never goes to PyPI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - run: rustup default stable
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --manifest-path gui/Cargo.toml
      - run: cp gui/target/x86_64-unknown-linux-musl/release/vinowhisper-gui vinowhisper-gui-x86_64-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gui
          path: vinowhisper-gui-x86_64-linux

  build:
    needs: gui
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag v${VERSION} does not match pyproject.toml version ${declared}"
            exit 1
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gui

      - name: Pin the overlay binary into the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/pin_gui_release.py vinowhisper-gui-x86_64-linux --version "$VERSION" --arch x86_64

      - name: Build sdist and wheel
        run: uv build

      - name: Check the wheel carries the overlay pin
        run: |
          if ! unzip -l dist/*.whl | grep -q 'vinowhisper/gui_release.json'; then
            echo "::error::the wheel has no vinowhisper/gui_release.json"
            exit 1
          fi

      - name: Check the metadata renders on PyPI
        # A rejected upload cannot be retried under the same version
        run: uvx twine check --strict dist/*

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG.md is hand-edited, so it is the source of release prose
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1              { found = 1; next }
            found && index($0, "## [") == 1  { exit }
            found                            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```'
            echo "pip install vinowhisper==${VERSION}"
            echo '```'
            echo
            echo 'Or the guided install, which also handles the NPU driver, the'
            echo 'model export and the systemd units:'
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/scripts/install.sh | bash"
            echo '```'
            echo
            echo 'The optional desktop overlay, captions and dictation (`vinowhisper-gui-x86_64-linux` below), is'
            echo 'installed and checked against the digest pinned in the wheel by:'
            echo
            echo '```'
            echo 'vinowhisper-setup --gui'
            echo '```'
          } >> RELEASE_NOTES.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/
            RELEASE_NOTES.md

  pypi:
    needs: build
    runs-on: ubuntu-latest
    # Named in PyPI's Trusted Publishing config; renaming it breaks uploads
    environment:
      name: pypi
      url: https://pypi.org/p/vinowhisper
    permissions:
      id-token: write # OIDC for Trusted Publishing. No API token anywhere.
    steps:
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      # Before the GitHub Release: a PyPI version can never be re-uploaded
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gui
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so gh cannot infer the repo
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag=false
