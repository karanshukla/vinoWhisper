name: Release

# Tag-driven: `uv run bump-my-version bump minor` writes the version, commits
# and tags v0.3.0; pushing that tag cuts the release.
#
# Not published to PyPI, and that is a decision rather than an omission: a
# `pip install vinowhisper` would resolve openvino from PyPI, where the builds
# the NPU static Whisper pipeline needs do not exist yet (see pyproject.toml).
# Shipping something that installs and then cannot load a model is worse than
# not shipping it. scripts/install.sh is the supported path; the artifacts here
# are for archival and for anyone who wants to vendor a specific version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag v${VERSION} does not match pyproject.toml version ${declared}"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG.md is the single source of release prose: git-cliff
          # generates it from conventional commits but it is hand-refined
          # before a release, and re-deriving notes from commits here would
          # silently discard those edits.
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1              { found = 1; next }
            found && index($0, "## [") == 1  { exit }
            found                            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/scripts/install.sh | bash"
            echo '```'
          } >> RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag=false
