name: Release

# Runs on the tag bump-my-version creates. Why the jobs are split: docs/development.md

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  tray:
    # musl, so one static binary runs on any distro. Never goes to PyPI.
    runs-on: ubuntu-latest
    env:
      # Pinned, not "stable": the binary ships, so a toolchain change is a reviewed diff.
      RUST_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-musl
      - run: rustup default "$RUST_TOOLCHAIN"
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --manifest-path tray/Cargo.toml
      - run: cp tray/target/x86_64-unknown-linux-musl/release/vinowhisper-tray vinowhisper-tray-x86_64-linux
      # What users download and the wheel pins: it runs, is this tag, and links nothing.
      - name: Smoke-test the binary
        run: |
          file vinowhisper-tray-x86_64-linux | grep 'static'
          test "$(./vinowhisper-tray-x86_64-linux --version)" = "vinowhisper-tray ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tray
          path: vinowhisper-tray-x86_64-linux

  gui:
    # The settings window. glibc, since winit dlopens libwayland and libEGL, which a static
    # musl binary cannot. Built on the oldest supported runner: it runs wherever glibc is
    # at least this runner's (2.35).
    runs-on: ubuntu-22.04
    env:
      RUST_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
      - run: rustup default "$RUST_TOOLCHAIN"
      - run: cargo build --release --locked --manifest-path gui/Cargo.toml
      - run: cp gui/target/release/vinowhisper-gui vinowhisper-gui-x86_64-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui
          path: vinowhisper-gui-x86_64-linux

  build:
    needs: [tray, gui]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Derive the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::tag v${VERSION} does not match pyproject.toml version ${declared}"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tray

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui

      - name: Pin the desktop binaries into the package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >-
          python3 scripts/pin_tray_release.py
          vinowhisper-tray-x86_64-linux vinowhisper-gui-x86_64-linux
          --version "$VERSION" --arch x86_64

      - name: Build sdist and wheel
        run: uv build

      - name: Install the wheel and run every command
        run: scripts/smoke_wheel.sh dist/*.whl

      - name: Check the wheel carries both pins
        run: |
          for pin in tray_release.json gui_release.json; do
            if ! unzip -l dist/*.whl | grep -q "vinowhisper/$pin"; then
              echo "::error::the wheel has no vinowhisper/$pin"
              exit 1
            fi
          done

      - name: Check the metadata renders on PyPI
        # A rejected upload cannot be retried under the same version
        run: uvx twine@7.0.0 check --strict dist/*

      - name: Extract the release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # CHANGELOG.md is hand-edited, so it is the source of release prose
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1              { found = 1; next }
            found && index($0, "## [") == 1  { exit }
            found                            { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section."
            exit 1
          fi
          {
            echo
            echo '## Install'
            echo
            echo '```'
            echo "pip install vinowhisper==${VERSION}"
            echo '```'
            echo
            echo 'Or the guided install, which also handles the NPU driver, the'
            echo 'model export and the systemd units:'
            echo
            echo '```'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/v${VERSION}/scripts/install.sh | bash"
            echo '```'
            echo
            echo 'The optional desktop app, the overlay and tray (`vinowhisper-tray-x86_64-linux`) and its'
            echo 'settings window (`vinowhisper-gui-x86_64-linux`), is installed and checked against the'
            echo 'digests pinned in the wheel by:'
            echo
            echo '```'
            echo 'vinowhisper-setup --gui'
            echo '```'
          } >> RELEASE_NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/
            RELEASE_NOTES.md

  pypi:
    needs: build
    # Belt and braces: only a pushed v* tag may publish, whatever triggers are added later.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Named in PyPI's Trusted Publishing config; renaming it breaks uploads
    environment:
      name: pypi
      url: https://pypi.org/p/vinowhisper
    permissions:
      id-token: write # OIDC for Trusted Publishing. No API token anywhere.
    steps:
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist

      # Before the GitHub Release: a PyPI version can never be re-uploaded
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  github-release:
    needs: [build, pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tray
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so gh cannot infer the repo
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
