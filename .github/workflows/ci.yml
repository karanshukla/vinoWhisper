name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

# The dev group only, never `uv sync`: no job here can use OpenVINO.
# deps-canary.yml checks the full set (docs/development.md).

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv venv
      - run: uv pip install --group dev
      - run: .venv/bin/ruff check .
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/mypy vinowhisper/

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        # Not 3.14: it breaks optimum's export (docs/install.md)
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install --group dev
      - run: .venv/bin/python -m pytest --cov=vinowhisper --cov-report=term-missing

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: shellcheck
        run: shellcheck scripts/install.sh scripts/convert_model.sh
      - name: bash -n the completion script
        run: bash -n scripts/vinowhisper-completion.bash

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
