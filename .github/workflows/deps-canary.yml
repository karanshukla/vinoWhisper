name: Dependency canary

# The full dependency set, which PR CI never installs (docs/development.md).

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/deps-canary.yml"

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      # Not --frozen: resolving from scratch is part of the test
      - name: uv sync (the full, real dependency set)
        run: uv sync --extra export

      - name: Import the stack that the NPU pipeline needs
        run: |
          uv run python - <<'PY'
          import openvino, openvino_genai
          print("openvino", openvino.__version__)
          print("openvino-genai", openvino_genai.__version__)
          # Enumeration only; the runner has no NPU
          print("devices:", openvino.Core().available_devices)
          PY

      # A resolve can succeed with an optimum-cli that dies on import (#24)
      - name: The export extra can actually run
        run: uv run optimum-cli env

      - name: Re-resolve against today's indexes
        run: uv lock --upgrade --dry-run
