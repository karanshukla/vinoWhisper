name: Bandit

# Config is [tool.bandit] in pyproject.toml, so `uv run poe security` matches it.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "32 0 * * 1"

permissions:
  contents: read

jobs:
  bandit:
    permissions:
      contents: read
      security-events: write # to upload the SARIF results
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Bandit scan
        # --exit-zero: findings must not fail the job, or the upload step below
        # is skipped and code scanning keeps showing the previous run's alerts.
        run: >-
          uvx --from 'bandit[toml,sarif]==1.9.4' bandit
          -c pyproject.toml -r vinowhisper/ -f sarif -o bandit.sarif --exit-zero

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: bandit.sarif
          category: bandit

      # The SARIF run above can never fail, so this one gates: no findings at all
      # today (2026-10-25), so any new one is a reviewed skip or a fix.
      - name: Bandit gate
        run: uvx --from 'bandit[toml]==1.9.4' bandit -c pyproject.toml -r vinowhisper/ -q
