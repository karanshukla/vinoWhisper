[package]
name = "vinowhisper-gui"
version = "0.1.0"
edition = "2024"
# let-chains, which are 1.88.
rust-version = "1.88"
description = "Floating caption overlay, tray icon and global shortcut for vinoWhisper, on Wayland"
license = "MIT"
repository = "https://github.com/karanshukla/vinoWhisper"
publish = false

# Every one of these is pure Rust, which is the point: the binary links
# nothing beyond libc, so it installs as one file on any distro, and the
# Python package it drives gains no dependencies at all.
#
#   smithay-client-toolkit  Wayland: layer-shell, shm buffers, the event loop.
#                           No libwayland (its pure-Rust backend) and no
#                           xkbcommon, since nothing here reads the keyboard.
#   cosmic-text             shaping, wrapping and glyph rasterising; finds
#                           fonts by parsing fontconfig's files, not by
#                           linking libfontconfig.
#   ksni                    the tray icon (StatusNotifierItem over D-Bus).
#   ashpd                   the global shortcut (xdg-desktop-portal).
#   rustix                  signals and the parent-death signal for the child.
[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-channel = "2.5.0"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
futures-lite = "2.6.1"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
