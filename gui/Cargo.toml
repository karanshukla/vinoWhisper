[package]
name = "vinowhisper-gui"
version = "1.0.1"
edition = "2024"
# let-chains; egui 0.37 needs 1.95
rust-version = "1.95"
description = "Settings window for vinoWhisper"
license = "MIT"
repository = "https://github.com/karanshukla/vinoWhisper"
publish = false

# Unlike the tray this is a glibc binary: winit dlopens libwayland and libEGL,
# which a static musl build cannot do (docs/development.md).
[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vinowhisper-settings = { path = "../settings" }

[dev-dependencies]
egui_kittest = { version = "0.37.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
