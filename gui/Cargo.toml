[package]
name = "vinowhisper-gui"
version = "1.1.1"
edition = "2024"
# let-chains; egui 0.37 needs 1.95
rust-version = "1.95"
description = "Settings window for vinoWhisper"
license = "MIT"
repository = "https://github.com/karanshukla/vinoWhisper"
publish = false

# Unlike the tray this is a glibc binary: winit dlopens libwayland and libEGL,
# which a static musl build cannot do (docs/development.md).
[dependencies]
# The tray's version; file_chooser and open_uri are the save dialog and "Open in…".
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "file_chooser", "open_uri"] }
async-io = "2.6.0"
# Process groups for Read aloud's Stop; already in the tree through winit.
rustix = { version = "1.1.4", features = ["process"] }
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vinowhisper-settings = { path = "../settings" }
vino-ui = { package = "vino-user-interface", version = "0.2.1" }

[dev-dependencies]
egui_kittest = { version = "0.37.0", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
