[package]
name = "vinowhisper-tray"
version = "1.6.0"
edition = "2024"
# vino-ui (cosmic-text 0.19 alone would be 1.89)
rust-version = "1.95"
description = "Floating captions, dictation, tray icon and global shortcuts for vinoWhisper, on Wayland"
license = "MIT"
repository = "https://github.com/karanshukla/vinoWhisper"
publish = false

# All pure Rust, so the binary links only libc (docs/development.md)
[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "global_shortcuts", "remote_desktop", "screencast"] }
async-io = "2.6.0"
async-channel = "2.5.0"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "swash", "fontconfig"] }
futures-lite = "2.6.1"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
rustix = { version = "1.1.4", features = ["fs", "net", "process", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vinowhisper-settings = { path = "../settings" }
# The vinoPilot apps and the tray menu icons every vinoPilot tray shares; no egui.
vino-ui = { package = "vino-user-interface", version = "0.4.0", default-features = false }
# Already in the tree through ksni and ashpd; named here for the screen reader announcements.
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
