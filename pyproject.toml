[project]
name = "vinowhisper"
version = "0.6.1"
description = "NPU-accelerated local live captioning for Linux, via OpenVINO GenAI Whisper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karan Shukla" }]
keywords = ["whisper", "openvino", "npu", "captions", "speech-to-text", "pipewire", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# 3.14 breaks optimum's export (docs/install.md)
requires-python = ">=3.11,<3.14"
dependencies = [
    # First stable release that builds the NPU static pipeline (docs/install.md)
    "openvino>=2026.3.1",
    "openvino-genai>=2026.3.1.0",
    # Also pulled in by openvino-genai; listed because the NPU pipeline needs it
    "openvino-tokenizers>=2026.3.1.0",
    "flask",
    "werkzeug",
    "requests",
    "numpy",
    "rich",
]

[project.optional-dependencies]
# The one-time model export. transformers 5.4+ breaks it on the NPU (docs/install.md)
export = [
    "optimum[openvino]",
    "transformers<5.4",
]

[project.urls]
Homepage = "https://github.com/karanshukla/vinoWhisper"
Repository = "https://github.com/karanshukla/vinoWhisper"
Issues = "https://github.com/karanshukla/vinoWhisper/issues"
Changelog = "https://github.com/karanshukla/vinoWhisper/blob/main/CHANGELOG.md"

[project.scripts]
vinowhisper-caption = "vinowhisper.caption:main"
vinowhisper-dictate = "vinowhisper.dictate:main"
vinowhisper-server = "vinowhisper.server:main"
vinowhisper-replay = "vinowhisper.replay:main"
vinowhisper-doctor = "vinowhisper.doctor:main"
vinowhisper-setup = "vinowhisper.wizard:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, or flat-layout discovery trips over systemd/ (docs/development.md)
packages = ["vinowhisper"]

# Dropping either from the wheel fails quietly (docs/development.md)
[tool.setuptools.package-data]
vinowhisper = ["model_digests.json", "gui_release.json"]

# ── uv ────────────────────────────────────────────────────────────────────────

[dependency-groups]
# Installable alone so CI never downloads OpenVINO (docs/development.md)
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "poethepoet>=0.27",
    "bump-my-version>=0.24",
    "types-requests",
    "numpy",
    "rich",
    # caption.py imports it, so tests/test_caption.py cannot be collected without it
    "requests",
]

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tool.poe.tasks]
lint  = "ruff check ."
fmt   = "ruff format --check ."
types = "mypy vinowhisper/"
test  = "pytest -v --tb=short"
fix.sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]
security.cmd = "uvx --from bandit[toml] bandit -c pyproject.toml -r vinowhisper/"
security.help = "the same Bandit scan the Bandit workflow runs"
check.sequence = ["lint", "fmt", "types", "test"]
check.help = "everything CI runs, locally"
doctor = "python -m vinowhisper.doctor"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is the formatter's job
    "SIM108", # ternary-instead-of-if is often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["vinowhisper"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
# No python_version: numpy's stubs need 3.12 syntax (docs/development.md)
ignore_missing_imports = true
warn_unused_ignores = false

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
pythonpath = ["."]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["vinowhisper"]
# Need an NPU, an audio server or a live socket
omit = ["vinowhisper/transcriber.py", "vinowhisper/server.py", "vinowhisper/replay.py"]

[tool.coverage.report]
show_missing = true

# ── Bandit ────────────────────────────────────────────────────────────────────

# Read by `poe security` and the Bandit workflow
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "build", "dist"]
# Why each check is skipped: docs/development.md
skips = [
    "B404",  # import subprocess
    "B603",  # subprocess without shell
    "B607",  # partial executable path
]

# ── bump-my-version ───────────────────────────────────────────────────────────

[tool.bumpversion]
current_version = "0.6.1"
commit = true
tag = true
tag_name = "v{new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# One version for the whole repo; tests/test_packaging.py checks all three
[[tool.bumpversion.files]]
filename = "gui/Cargo.toml"
search = "name = \"vinowhisper-gui\"\nversion = \"{current_version}\""
replace = "name = \"vinowhisper-gui\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "gui/Cargo.lock"
search = "name = \"vinowhisper-gui\"\nversion = \"{current_version}\""
replace = "name = \"vinowhisper-gui\"\nversion = \"{new_version}\""
