[project]
name = "vinowhisper"
version = "0.3.0"
description = "NPU-accelerated local live captioning for Linux, via OpenVINO GenAI Whisper"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Karan Shukla" }]
keywords = ["whisper", "openvino", "npu", "captions", "speech-to-text", "pipewire", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Python 3.14 is unusable here: it made functools.partial a descriptor, which
# breaks optimum's `NORMALIZED_CONFIG_CLASS = SomeConfig.with_args(...)` class-
# attribute idiom (self gets auto-bound as an extra positional arg). Confirmed
# 2026-08-03 across every optimum/optimum-intel/transformers version tried —
# root cause, not a version-pairing issue. Use 3.13 until upstream fixes it.
requires-python = ">=3.11,<3.14"
dependencies = [
    # 2026.3.1 is the floor because it is the first *stable* release that can
    # build the NPU static Whisper pipeline. Stable 2026.2.1 could not: its
    # pipeline_static.cpp pattern-matcher did not recognize the optimum-intel
    # export's SDPA attention-mask node shape
    # (OPENVINO_ASSERT(!self_attn_nodes.empty())), which is why this project
    # pinned the nightly wheel index from 2026-08-03 until 2026-08-31.
    # Re-measured 2026-08-31 on the Wildcat Lake NPU against the same
    # --disable-stateful export, WhisperPipeline(..., STATIC_PIPELINE=True):
    # 2026.3.1 stable builds in 2.0s and decodes, as do nightly 2026.4.0.dev-
    # 20260805 and 2026.5.0.dev20260831. Stable caught up, so the nightly
    # index, the global prerelease policy and the weekly resolve canary are
    # all gone and these resolve from PyPI like anything else.
    "openvino>=2026.3.1",
    "openvino-genai>=2026.3.1.0",
    # Pulled in transitively by openvino-genai and still listed directly: the
    # NPU pipeline hard-depends on it, and a transitive-only dependency is one
    # upstream packaging change away from disappearing silently.
    "openvino-tokenizers>=2026.3.1.0",
    "optimum[openvino]",
    "flask",
    "werkzeug",
    "requests",
    "numpy",
    # Status bar only. Rich rather than Textual because the transcript is
    # append-only (see stitch.py), so it belongs in the terminal's own
    # scrollback and only the status line needs to redraw.
    "rich",
]

[project.urls]
Homepage = "https://github.com/karanshukla/vinoWhisper"
Repository = "https://github.com/karanshukla/vinoWhisper"
Issues = "https://github.com/karanshukla/vinoWhisper/issues"
Changelog = "https://github.com/karanshukla/vinoWhisper/blob/main/CHANGELOG.md"

[project.scripts]
vinowhisper-caption = "vinowhisper.caption:main"
vinowhisper-server = "vinowhisper.server:main"
vinowhisper-replay = "vinowhisper.replay:main"
vinowhisper-doctor = "vinowhisper.doctor:main"
vinowhisper-setup = "vinowhisper.wizard:main"

[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Without this, setuptools' flat-layout auto-discovery sees the top-level
# systemd/ directory (unit files, not a package) and refuses to build,
# thinking it found two packages. Confirmed failing 2026-08-03.
packages = ["vinowhisper"]

# ── uv ────────────────────────────────────────────────────────────────────────

[dependency-groups]
# Deliberately installable on its own (`uv sync --only-group dev`): CI has no
# NPU, no audio server and no reason to download ~400MB of OpenVINO to run
# tests that are forbidden from importing it. Nothing under tests/ imports
# openvino, transcriber or server, which is what keeps this split honest.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "poethepoet>=0.27",
    "bump-my-version>=0.24",
    "types-requests",
    "numpy",
    "rich",
]

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tool.poe.tasks]
lint  = "ruff check ."
fmt   = "ruff format --check ."
types = "mypy vinowhisper/"
test  = "pytest -v --tb=short"
fix.sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]
security.cmd = "uvx --from bandit[toml] bandit -c pyproject.toml -r vinowhisper/"
security.help = "the same Bandit scan the Bandit workflow runs"
check.sequence = ["lint", "fmt", "types", "test"]
check.help = "everything CI runs, locally"
doctor = "python -m vinowhisper.doctor"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is the formatter's job
    "SIM108", # ternary-instead-of-if is often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["vinowhisper"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
# Deliberately not pinned to python_version = "3.11". Numpy's own stubs use
# 3.12-only syntax (`type X = ...`), and mypy parses them against the target
# version, so pinning 3.11 while running on 3.12 fails inside numpy with a
# syntax error before it checks any of this project's code. The floor is
# enforced where it belongs anyway: requires-python and ruff's target-version.
#
# openvino_genai ships no stubs, and CI type-checks without it installed at all
# (see the dev group note above).
ignore_missing_imports = true
warn_unused_ignores = false

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# The package is imported from the source tree, not from an install: CI never
# installs the project itself, because that would drag in the OpenVINO nightly
# stack it deliberately does without.
pythonpath = ["."]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["vinowhisper"]
# Not covered by design: these need an NPU, an audio server, or a live socket.
omit = ["vinowhisper/transcriber.py", "vinowhisper/server.py", "vinowhisper/replay.py"]

[tool.coverage.report]
show_missing = true

# ── Bandit ────────────────────────────────────────────────────────────────────

# Read with `bandit -c pyproject.toml` (needs the `toml` extra). The Bandit
# workflow passes the same flag, so CI and `poe security` agree.
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "build", "dist"]
# Three blanket skips, each because the finding is this tool's entire job
# rather than a defect in it. B602 (shell=True) stays ON, and is the one that
# would actually matter: there is no shell anywhere in this codebase, and if
# one ever appears it should fail this scan.
skips = [
    # blacklist — flags the `import subprocess` line itself, in a program whose
    # purpose is to drive pw-record, parec, pactl, optimum-cli and systemctl.
    "B404",
    # subprocess_without_shell_equals_true. Every call site builds a literal
    # argv list and passes it without a shell, so there is nothing to inject
    # into: the variable parts are PipeWire node names read from pw-dump and a
    # --target the user typed, both of which arrive as single argv elements.
    "B603",
    # start_process_with_partial_path. Deliberate: pw-record, parec and pactl
    # live in different places on different distros, and hardcoding /usr/bin
    # would break the fallbacks this release exists to add. PATH resolution is
    # the portable behaviour here, and the tools are located with shutil.which
    # before use.
    "B607",
]

# ── bump-my-version ───────────────────────────────────────────────────────────

[tool.bumpversion]
current_version = "0.3.0"
commit = true
tag = true
tag_name = "v{new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
