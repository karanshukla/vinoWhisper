[project]
name = "vinowhisper"
version = "0.2.0"
description = "NPU-accelerated local live captioning for Linux, via OpenVINO GenAI Whisper"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Karan Shukla" }]
keywords = ["whisper", "openvino", "npu", "captions", "speech-to-text", "pipewire", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Python 3.14 is unusable here: it made functools.partial a descriptor, which
# breaks optimum's `NORMALIZED_CONFIG_CLASS = SomeConfig.with_args(...)` class-
# attribute idiom (self gets auto-bound as an extra positional arg). Confirmed
# 2026-08-03 across every optimum/optimum-intel/transformers version tried —
# root cause, not a version-pairing issue. Use 3.13 until upstream fixes it.
requires-python = ">=3.11,<3.14"
dependencies = [
    # Stable openvino-genai (2026.2.1 as of 2026-08-03) can't build the NPU
    # static Whisper pipeline: its pipeline_static.cpp pattern-matcher doesn't
    # recognize the current optimum-intel export's SDPA attention-mask node
    # shape (OPENVINO_ASSERT(!self_attn_nodes.empty()) fails). Needs the
    # nightly wheel index until a stable release catches up — same versions
    # upstream's own openvino.genai samples/deployment-requirements.txt pins.
    # The nightly index and prerelease policy live in [tool.uv] below, so
    # `uv sync` alone resolves these without extra flags. This is also why
    # `pip install vinowhisper` is not the documented install path: pip does
    # not read [tool.uv.sources] and would resolve openvino from PyPI.
    "openvino>=2026.4.0.dev",
    "openvino-genai>=2026.4.0.0.dev",
    # Pulled in transitively by openvino-genai, but must be listed directly:
    # [tool.uv.sources] index routing below only applies to the project's own
    # direct dependencies, not to transitive ones (confirmed 2026-08-06).
    "openvino-tokenizers>=2026.4.0.0.dev",
    "optimum[openvino]",
    "flask",
    "werkzeug",
    "requests",
    "numpy",
    # Status bar only. Rich rather than Textual because the transcript is
    # append-only (see stitch.py), so it belongs in the terminal's own
    # scrollback and only the status line needs to redraw.
    "rich",
]

[project.urls]
Homepage = "https://github.com/karanshukla/vinoWhisper"
Repository = "https://github.com/karanshukla/vinoWhisper"
Issues = "https://github.com/karanshukla/vinoWhisper/issues"
Changelog = "https://github.com/karanshukla/vinoWhisper/blob/main/CHANGELOG.md"

[project.scripts]
vinowhisper-caption = "vinowhisper.caption:main"
vinowhisper-server = "vinowhisper.server:main"
vinowhisper-replay = "vinowhisper.replay:main"
vinowhisper-doctor = "vinowhisper.doctor:main"
vinowhisper-setup = "vinowhisper.wizard:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Without this, setuptools' flat-layout auto-discovery sees the top-level
# systemd/ directory (unit files, not a package) and refuses to build,
# thinking it found two packages. Confirmed failing 2026-08-03.
packages = ["vinowhisper"]

# ── uv ────────────────────────────────────────────────────────────────────────

[tool.uv]
# openvino/openvino-genai only exist above 2026.2.1 as nightly dev builds
# (see the dependency comment above), so prereleases must be allowed globally
# or optimum[openvino]'s own (non-prerelease) openvino version range makes
# the resolve unsatisfiable.
prerelease = "allow"

[[tool.uv.index]]
name = "openvino-nightly"
url = "https://storage.openvinotoolkit.org/simple/wheels/nightly"
# explicit: only packages routed to it below use this index. Without this,
# it fully replaces PyPI as the default index instead of adding to it
# (confirmed 2026-08-06 — flask etc. became unresolvable).
explicit = true

[tool.uv.sources]
openvino = { index = "openvino-nightly" }
openvino-genai = { index = "openvino-nightly" }
openvino-tokenizers = { index = "openvino-nightly" }

[dependency-groups]
# Deliberately installable on its own (`uv sync --only-group dev`): CI runs the
# tests without the OpenVINO nightly stack, which has no CI-friendly resolve —
# nightly builds are pruned upstream, so a locked dev wheel goes 404 on its own
# schedule. Nothing under tests/ imports openvino for the same reason.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "poethepoet>=0.27",
    "bump-my-version>=0.24",
    "types-requests",
    "numpy",
    "rich",
]

# ── Tasks ─────────────────────────────────────────────────────────────────────

[tool.poe.tasks]
lint  = "ruff check ."
fmt   = "ruff format --check ."
types = "mypy vinowhisper/"
test  = "pytest -v --tb=short"
fix.sequence = [{ cmd = "ruff check --fix ." }, { cmd = "ruff format ." }]
security.cmd = "uvx --from bandit[toml] bandit -c pyproject.toml -r vinowhisper/"
security.help = "the same Bandit scan the Bandit workflow runs"
check.sequence = ["lint", "fmt", "types", "test"]
check.help = "everything CI runs, locally"
doctor = "python -m vinowhisper.doctor"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line length is the formatter's job
    "SIM108", # ternary-instead-of-if is often less readable
]

[tool.ruff.lint.isort]
known-first-party = ["vinowhisper"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
# openvino_genai ships no stubs, and CI type-checks without it installed at all
# (see the dev group note above).
ignore_missing_imports = true
warn_unused_ignores = false

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
# The package is imported from the source tree, not from an install: CI never
# installs the project itself, because that would drag in the OpenVINO nightly
# stack it deliberately does without.
pythonpath = ["."]

# ── Coverage ──────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["vinowhisper"]
# Not covered by design: these need an NPU, an audio server, or a live socket.
omit = ["vinowhisper/transcriber.py", "vinowhisper/server.py", "vinowhisper/replay.py"]

[tool.coverage.report]
show_missing = true

# ── Bandit ────────────────────────────────────────────────────────────────────

# Read with `bandit -c pyproject.toml` (needs the `toml` extra). The Bandit
# workflow passes the same flag, so CI and `poe security` agree.
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", "build", "dist"]
skips = [
    # blacklist — flags the `import subprocess` line itself. This tool is a
    # wrapper around pw-record/parec/pactl/optimum-cli; every call site is a
    # fixed argv list with no shell, and is reviewed individually by B602-B607.
    "B404",
]

# ── bump-my-version ───────────────────────────────────────────────────────────

[tool.bumpversion]
current_version = "0.2.0"
commit = true
tag = true
tag_name = "v{new_version}"
pre_commit_hooks = ["uv lock", "git add uv.lock"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
