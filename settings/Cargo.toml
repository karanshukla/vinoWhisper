[package]
name = "vinowhisper-settings"
version = "1.10.0"
edition = "2024"
# let-chains
rust-version = "1.88"
description = "The settings files shared by the vinoWhisper tray and settings window"
license = "MIT"
repository = "https://github.com/karanshukla/vinoWhisper"
publish = false

[dependencies]
# /.flatpak-info is a GKeyFile. No dependencies of its own.
configparser = "3.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
